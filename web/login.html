<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23b91c1c%22/%3E%3Ctext x=%2232%22 y=%2243%22 font-family=%22Arial%22 font-weight=%22900%22 font-size=%2228%22 text-anchor=%22middle%22 fill=%22white%22%3EIE%3C/text%3E%3C/svg%3E">
  <title>Log in · IELTS Practice</title>
</head>
<body class="theme-app">
  <main class="login-wrap">
    <form class="login-card" id="login-form" novalidate>
      <div class="brand"><span class="brand-mark">IE</span><div><b>IELTS Practice</b><small>Private — please log in</small></div></div>
      <label class="field" id="username-field" hidden>
        <span class="field-label">Username</span>
        <input class="input" type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false">
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <p class="login-error" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-lg" type="submit" id="login-btn">Log in</button>
    </form>
  </main>
  <script type="module" src="/src/login.ts"></script>
</body>
</html>
